name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt-check, compile, compile-integration, vet, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Stay in lockstep with the module's Go directive.
          go-version-file: go.mod

      - name: Run the pre-merge gate
        run: make check

      # Smoke-test the doc walker (cobra/doc tree generation) so a broken
      # command tree is caught in CI rather than when someone runs `make docs`.
      - name: Check gen-docs runs cleanly
        run: make docs-check

      - name: Test live harness without live credentials
        run: go test -tags=integration ./integration -run '^TestHarness' -count=1

      - name: Test live matrix accounting and cancellation
        run: python3 -m unittest discover -s scripts -p '*_test.py'

  process-contracts:
    name: CLI process contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Unix completion shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install Unix completion shells (macOS)
        if: runner.os == 'macOS'
        run: command -v fish >/dev/null || brew install fish
      - name: Prepare isolated native credential store (macOS)
        if: runner.os == 'macOS'
        run: |
          test_keychain="$RUNNER_TEMP/atl-e2e.keychain-db"
          test_keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$test_keychain_password" "$test_keychain"
          security set-keychain-settings -lut 21600 "$test_keychain"
          security unlock-keychain -p "$test_keychain_password" "$test_keychain"
          security list-keychains -d user -s "$test_keychain"
          security default-keychain -d user -s "$test_keychain"
      - name: Run hermetic CLI subprocess tests
        env:
          ATL_E2E_REQUIRED_SHELLS: ${{ runner.os == 'Windows' && 'powershell' || 'bash,zsh,fish' }}
          ATL_E2E_NATIVE_CREDENTIALS: ${{ runner.os != 'Linux' && '1' || '' }}
        run: go test ./e2e -count=1
      - name: Remove isolated native credential store (macOS)
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/atl-e2e.keychain-db"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Build golangci-lint from source with the module's own Go toolchain
      # rather than downloading a prebuilt release. A prebuilt binary bundles
      # the Go version it was compiled against; if that lags the `go` directive
      # (1.26.x), its type-checker can fail on newer language features. Building
      # it here pins the linter's checker to the exact toolchain that compiles
      # the code, and runs the identical `make lint` path used locally.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Run golangci-lint
        run: golangci-lint run ./...

  race:
    name: race + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Run the hermetic suite under the race detector with coverage. This is a
      # separate job from `check` because -race roughly triples runtime; keeping
      # it parallel means the fast gate is not held up by it.
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
